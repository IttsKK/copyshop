[package]
name = "grain-emulator"
version = "1.4.0"
description = "copyshop"
edition = "2021"

[lib]
name = "grain_emulator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
urlencoding = "2"

# Windows and Linux have no sips: thumbnails and RAW files are read in Rust.
# None of this is in the Mac build.
[target.'cfg(not(target_os = "macos"))'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp", "gif"] }
rawler = "0.8.0"
# A JPEG thumbnail read straight at a fraction of its size (portable.rs small_jpeg).
jpeg-decoder = { version = "0.3", default-features = false }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
# Photos replaced by a better copy go to the Trash, from where they can be put back.
trash = "5"
tauri-plugin-updater = "2"
# copyshop:// links (the playground's Desktop app button), and handing one to the copy already open.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Precise selection (src/ml.rs): ONNX Runtime's own prebuilt library, linked in, for
# Apple silicon and Windows on x86_64; on Windows it runs on the GPU through DirectML.
# Not on Intel Macs (no prebuilt library) or Linux (its library needs glibc 2.38, and
# the Linux build is made on Ubuntu 22.04 to run on older systems too): there precise
# selection runs what it can in the page.
[target.'cfg(any(all(target_os = "macos", target_arch = "aarch64"), all(target_os = "windows", target_arch = "x86_64")))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "copy-dylibs", "api-24"] }
[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "copy-dylibs", "api-24", "directml"] }

# The thumbnail test runs on a Mac too.
[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp", "gif"] }
jpeg-decoder = { version = "0.3", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
