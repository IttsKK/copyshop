[package]
name = "grain-emulator"
version = "1.3.0"
description = "copyshop"
edition = "2021"

[lib]
name = "grain_emulator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
urlencoding = "2"

# Windows and Linux have no sips: thumbnails and RAW files are read in Rust.
# None of this is in the Mac build.
[target.'cfg(not(target_os = "macos"))'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp", "gif"] }
rawler = "0.8.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
# Photos replaced by a better copy go to the Trash, from where they can be put back.
trash = "5"
tauri-plugin-updater = "2"
# copyshop:// links (the playground's Desktop app button), and handing one to the copy already open.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# The thumbnail test runs on a Mac too.
[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp", "gif"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
